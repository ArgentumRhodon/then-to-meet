<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Find the best time to meet from any When2Meet poll: choose who's required, rank times, and share the result."
		/>
		<script>
			// Start on the dark theme, the default. A signed-in user's saved theme and heatmap palette
			// are applied as soon as they're loaded from their account (see state/session.ts).
			document.documentElement.dataset.theme = 'dark';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

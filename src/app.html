<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Find the best time to meet from any When2Meet poll: rank times, mark who's required, and share the result."
		/>
		<script>
			// Apply the saved theme (dark by default) and heatmap palette before first paint.
			(function () {
				let pref = 'dark';
				let heat = null;
				try {
					pref = localStorage.getItem('ttm:theme') || 'dark';
					heat = localStorage.getItem('ttm:heat');
				} catch {}
				if (pref === 'light' || pref === 'dark') {
					document.documentElement.dataset.theme = pref;
				}
				if (heat === 'deuteranopia' || heat === 'protanopia' || heat === 'tritanopia') {
					document.documentElement.dataset.heat = heat;
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
